
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Image Slider</h1>

        <div class="slider" id="slider">
            <img id="slideImage" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80" alt="Nature">

            <button id="prev" class="prev">❮</button>
            <button id="next" class="next">❯</button>

            <div id="caption" class="caption">Beautiful Nature</div>
            <div id="indicators" class="indicators"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
